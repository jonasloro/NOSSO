<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOSSO | Finanças</title><style>
*{box-sizing:border-box}body{margin:0;background:#141020;color:#e8eee9;font:15px system-ui}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:4px;margin:0;color:#bca0ff}small,label{color:#a0ada3}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #493b60;background:#2c2340;color:white}button{cursor:pointer}button.primary{background:#bca0ff;color:#201331;font-weight:bold}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.panel,article{background:#211a31;border:1px solid #3b3050;border-radius:15px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.amount{font-size:clamp(20px,4vw,34px);font-weight:700;color:#bca0ff;margin:10px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}label{display:grid;gap:6px;margin-bottom:12px}input,select{width:100%;min-width:0}h2,h3{margin-top:0}progress{width:100%;accent-color:#a78bfa;height:12px}dialog{background:#211a31;color:white;border:1px solid #493b60;border-radius:16px;width:min(94%,480px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}.item{border-bottom:1px solid #3b3050;padding:14px 0}.muted{color:#a0ada3}footer{padding:20px;text-align:center;color:#a0ada3}svg{max-width:100%}nav{display:flex;flex-wrap:nowrap;overflow-x:auto;padding:5px;background:#211a31;border-radius:14px;gap:4px}nav button{white-space:nowrap;flex:1;border:0;background:transparent;color:#a0ada3;font-size:13px;padding:12px 14px}nav button.active{background:#bca0ff;color:#201331;font-weight:700} .filters{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding:14px}.filters label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin:0}.filters select,.filters input{background:#191326;border-color:#493b60;font-size:13px;padding:10px 8px;min-height:42px}.finance-summary article{border-top:2px solid #a78bfa}article{box-shadow:0 4px 18px #0002} @media(max-width:520px){header,main{padding:14px}nav button{flex:0 0 auto}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.grid article{padding:14px}.amount{font-size:23px}}html[data-theme="pink"] body{background:#190b15;color:#f8eaf2}html[data-theme="pink"] header h1,html[data-theme="pink"] .amount{color:#ff1493}html[data-theme="pink"] .panel,html[data-theme="pink"] article,html[data-theme="pink"] nav,html[data-theme="pink"] dialog{background:#291021;border-color:#50364b}html[data-theme="pink"] button,html[data-theme="pink"] input,html[data-theme="pink"] select{background:#352438;border-color:#60435a}html[data-theme="pink"] button.primary,html[data-theme="pink"] nav button.active{background:#ff1493;color:#ffffff}html[data-theme="pink"] progress{accent-color:#ff1493}html[data-theme="pink"] .finance-summary article{border-top-color:#ff1493}html[data-theme="pink"] .filters input,html[data-theme="pink"] .filters select{background:#211521}html[data-theme="pink"] small,html[data-theme="pink"] label,html[data-theme="pink"] .muted{color:#d0afc4}html[data-theme="pink"] .amount[style*="#bca0ff"]{color:#ff1493!important}.theme-picker{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:0 0 12px}.theme-picker button{padding:8px 12px;font-size:12px}.theme-picker button[aria-pressed="true"]{outline:2px solid currentColor;outline-offset:2px}.donut-layout{display:grid;gap:18px;justify-items:center}.donut-chart{width:min(100%,250px);aspect-ratio:1;position:relative}.donut-chart svg{width:100%;height:100%;overflow:visible}.donut-chart circle[data-segment]{cursor:pointer;transition:opacity .18s,stroke-width .18s}.donut-chart circle[data-segment]:focus,.donut-chart circle[data-segment]:hover{stroke-width:22;outline:none}.donut-center{position:absolute;inset:27%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;pointer-events:none}.donut-center b{font-size:clamp(12px,3vw,20px)}.donut-legend{width:100%;display:grid;gap:6px}.donut-legend button{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;width:100%;padding:9px;background:transparent;border:1px solid transparent}.donut-legend button:hover,.donut-legend button:focus{border-color:currentColor}.donut-dot{width:10px;height:10px;border-radius:50%}.donut-legend small{display:block;font-size:11px}.donut-legend b{font-size:13px}.db-status{display:inline-flex;align-items:center;gap:7px;font-size:12px;padding:7px 10px;border:1px solid #ffffff25;border-radius:20px;cursor:pointer}.db-dot{width:8px;height:8px;border-radius:50%;background:#a0ada3}.db-status[data-state="ok"] .db-dot{background:#4ade80;box-shadow:0 0 8px #4ade8080}.db-status[data-state="error"] .db-dot{background:#fb7185}.db-status[data-state="checking"] .db-dot{background:#fbbf24}body:not(.authenticated) header,body:not(.authenticated) main,body:not(.authenticated) footer,body:not(.authenticated) #syncLogin,body:not(.authenticated) #syncStatus,body:not(.authenticated) #refreshData{display:none}body:not(.authenticated) #loginModal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);margin:0}#loginModal h2{color:#bca0ff}html[data-theme="pink"] #loginModal h2{color:#ff1493}</style>
<header><div><h1>NOSSO</h1><small>Finanças da nossa casa</small><div style="margin-top:8px"><button type="button" class="db-status" id="dbStatus" data-state="checking" aria-live="polite"><span class="db-dot"></span><span id="dbStatusText">Verificando banco…</span></button></div></div><button class="primary" onclick="openForm()">+ Gasto</button></header><main><div class="theme-picker"><small>Tema</small><button id="themeGreen" style="color:#bca0ff" aria-pressed="true">● Roxo</button><button id="themePink" style="color:#ff1493" aria-pressed="false">● Pink</button></div><nav><button onclick="view='receitas';render()">Receitas do mês</button><button onclick="view='painel';render()">Visão geral</button><button onclick="view='lista';render()">Lançamentos</button><button onclick="view='contas';render()">Cartões e contas</button></nav><div class="panel filters"><label>Mês<input type="month" id="month"><button type="button" id="allMonths">Todos os meses</button></label><label>Responsável<select id="who"><option>Todos</option><option>Jhonatan</option><option>Ari</option><option>Casa</option></select></label><label>Pagamento<select id="pay"><option>Todos</option></select></label></div><div id="screen"></div><div class="panel row"><button onclick="backup()">Exportar backup</button><label>Importar backup<input type="file" id="restore" accept=".json"></label></div></main><div class="panel" style="max-width:1060px;margin:12px auto"><button id="syncLogin">Entrar para sincronizar</button> <span id="syncStatus" role="status">Consultando Supabase…</span> <button id="refreshData" type="button">Atualizar dados</button></div><footer>Lançamentos novos exigem login e são gravados no Supabase.</footer>
<dialog id="loginModal"><form id="loginForm"><h2>Entrar no NOSSO</h2><label>Quem está entrando?<select name="user"><option value="Jhonatan">Jhonatan</option><option value="Ari">Ariane</option></select></label><label>Senha<input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" role="alert"></p><div class="row"><button type="button" onclick="location.reload()">Recarregar</button><button class="primary">Entrar</button></div></form></dialog><dialog id="modal"><form id="form"><h2>Novo lançamento</h2><label>Quem?<select name="person"><option>Jhonatan</option><option>Ari</option><option>Casa</option></select></label><div class="grid"><label>Valor (R$)<input name="value" type="number" min=".01" step=".01" required></label><label>Data<input name="date" type="date" required></label></div><label>Descrição<input name="description" required maxlength="200"></label><label>Categoria<select name="category"></select></label><label>Forma de pagamento<select name="type"></select></label><label>Banco, cartão ou plataforma<input name="platform" required maxlength="100"></label><div class="row"><button type="button" onclick="modal.close()">Cancelar</button><button class="primary">Salvar</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),modal=$('modal'),form=$('form'),people=['Jhonatan','Ari','Casa'],types=['Cartão de crédito','Cartão de débito','Empréstimo','Financiamento','Pix','Dinheiro','Boleto','Outro'],cats=['Mercado','Alimentação','Moradia','Transporte','Lazer','Saúde','Compras','Assinaturas','Educação','Contas da casa','Dívidas','Outros'];let data=[],incomes=[],view='painel',editing=null,editingIncomeId=null,incomeBusy=false,expenseBusy=false,expenseDraftId=null,incomeDraftId=null,online=false;const today=()=>new Date().toLocaleDateString('sv-SE'),money=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),sum=a=>a.reduce((s,e)=>s+e.cents,0),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,method="GET",body){let r;try{r=await fetch(path,{method,cache:"no-store",credentials:"same-origin",headers:{"Content-Type":"application/json","X-Nosso":"1"},body:body===undefined?undefined:JSON.stringify(body)})}catch{throw Error("Sem conexão com o servidor. Tente novamente.")}let j;try{j=await r.json()}catch{throw Error("Resposta inválida do servidor.")}if(!r.ok){if(r.status===401&&path!=="/api/login"){online=false;data=[];incomes=[];document.body.classList.remove("authenticated");if(modal.open)modal.close();if(!$("loginModal").open)$("loginModal").showModal()}throw Error(j.error||"Falha na comunicação com o Supabase")}return j}
function rememberFilters(){try{sessionStorage.setItem("nosso-month",$("month").value);sessionStorage.setItem("nosso-view",view)}catch{}}
function selectMonth(m){$("month").value=m;rememberFilters()}
function reportError(e){alert(e.message||"Falha na comunicação com o servidor")}
function syncLabel(s){$("syncStatus").textContent=s}
async function refreshAfterWrite(){try{await loadOnline()}catch(e){syncLabel("Alteração confirmada · Atualize os dados");alert("Alteração gravada no Supabase, mas não foi possível atualizar a lista. Use Atualizar dados.")}}
async function writeRecord(path,method,record){syncLabel("Salvando no Supabase…");try{const r=await api(path,method,record);if(r.ok!==true)throw Error("Gravação não confirmada");return r}catch(e){syncLabel("Operação não confirmada");throw e}}
function options(a){return a.map(x=>'<option>'+esc(x)+'</option>').join('')}form.elements.category.innerHTML=options(cats);form.elements.type.innerHTML=options(types);$('pay').innerHTML=options(['Todos',...types]);try{$("month").value=sessionStorage.getItem("nosso-month")||"";const v=sessionStorage.getItem("nosso-view");if(["painel","receitas","lista","contas"].includes(v))view=v}catch{};["month","who","pay"].forEach(id=>$(id).onchange=()=>{rememberFilters();render()});$("allMonths").onclick=()=>{selectMonth("");render()};
function groups(a,k){let m=new Map;for(let e of a)m.set(e[k],(m.get(e[k])||0)+e.cents);return [...m].sort((a,b)=>b[1]-a[1])}function bars(a,k){let t=sum(a);return groups(a,k).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><b>'+money(v)+'</b></div><progress max="'+(t||1)+'" value="'+v+'"></progress>').join('')||'<p class="muted">Sem lançamentos</p>'}
function list(a){return [...a].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>'<div class="item"><div class="row"><div><b>'+esc(e.description)+'</b><br><small>'+esc(e.person)+' · '+esc(e.platform)+' · '+esc(e.type)+' · '+esc(e.date)+'</small></div><b>'+money(e.cents)+'</b></div><div class="row"><small>'+esc(e.category)+'</small><div><button data-edit="'+esc(e.id)+'">Editar</button> <button data-delete="'+esc(e.id)+'">Excluir</button></div></div></div>').join('')||'<p class="muted">Nenhum gasto registrado.</p>'}
function categoryDonut(a){let g=groups(a,"category"),t=sum(a);if(!t)return '<p class="muted">Adicione gastos para visualizar a distribuição por categoria.</p>';let palette=document.documentElement.dataset.theme==="pink"?["#ff1493","#ff80bf","#c084fc","#fb7185","#fbbf24","#38bdf8","#a3e635","#f472b6","#818cf8","#2dd4bf","#fdba74","#e879f9"]:["#a78bfa","#60a5fa","#f472b6","#2dd4bf","#fbbf24","#818cf8","#fb7185","#a3e635","#c084fc","#38bdf8","#fdba74","#e879f9"];let offset=0,C=2*Math.PI*39;let segments=g.map(([n,v],i)=>{let length=v/t*C,o=offset;offset+=length;return '<circle data-segment="'+i+'" tabindex="0" role="button" aria-label="'+esc(n)+' '+money(v)+'" cx="50" cy="50" r="39" fill="none" stroke="'+palette[i%palette.length]+'" stroke-width="17" stroke-dasharray="'+length+' '+(C-length)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 50 50)"><title>'+esc(n)+' · '+money(v)+' · '+(v/t*100).toFixed(1)+'%</title></circle>'}).join("");return '<div class="donut-layout"><div class="donut-chart"><svg viewBox="0 0 100 100" aria-label="Distribuição de despesas">'+segments+'</svg><div class="donut-center"><small id="donutLabel">Total</small><b id="donutValue">'+money(t)+'</b><small id="donutPercent">100%</small></div></div><div class="donut-legend">'+g.map(([n,v],i)=>'<button data-category="'+i+'" data-name="'+esc(n)+'" data-value="'+money(v)+'" data-percent="'+(v/t*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+'%"><span class="donut-dot" style="background:'+palette[i%palette.length]+'"></span><span>'+esc(n)+'<small>'+money(v)+'</small></span><b>'+(v/t*100).toLocaleString("pt-BR",{maximumFractionDigits:1})+'%</b></button>').join("")+'</div></div>'}function bindDonut(){let rows=[...document.querySelectorAll("[data-category]")],segments=[...document.querySelectorAll("[data-segment]")];function select(i){let r=rows[i];if(!r)return;$("donutLabel").textContent=r.dataset.name;$("donutValue").textContent=r.dataset.value;$("donutPercent").textContent=r.dataset.percent;segments.forEach((s,j)=>s.style.opacity=j===i?"1":".32")}rows.forEach((r,i)=>{r.onclick=()=>select(i);r.onmouseenter=()=>select(i)});segments.forEach((s,i)=>{s.onclick=()=>select(i);s.onmouseenter=()=>select(i);s.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(i)}}})}function render(){rememberFilters();document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.getAttribute("onclick").includes("\u0027"+view+"\u0027")));let a=data.filter(e=>(!$('month').value||e.date.startsWith($('month').value))&&($('who').value==='Todos'||e.person===$('who').value)&&($('pay').value==='Todos'||e.type===$('pay').value)),t=sum(a);if(view==='receitas'){renderIncome();return}let html='<article><small>Total no período</small><div class="amount">'+money(t)+'</div>'+a.length+' lançamentos</article>';if(view==='painel'){let incomeTotal=sum((incomes||[]).filter(e=>(!$("month").value||e.date.startsWith($("month").value))&&($("who").value==="Todos"||e.person===$("who").value))),balance=incomeTotal-t;html+='<div class="grid finance-summary"><article><small>Receitas do mês</small><div class="amount">'+money(incomeTotal)+'</div></article><article><small>'+(balance<0?"Vai faltar":"Vai sobrar")+'</small><div class="amount" style="color:'+(balance<0?"#ff9999":"#bca0ff")+'">'+money(Math.abs(balance))+'</div></article></div>';html+='<div class="grid">'+people.map(p=>'<article><small>'+p+'</small><div class="amount">'+money(sum(a.filter(e=>e.person===p)))+'</div></article>').join('')+'</div><div class="grid"><article><h3>Por responsável</h3>'+bars(a,'person')+'</article><article><h3>Por categoria</h3>'+categoryDonut(a)+'</article></div><article><h3>Evolução mensal</h3>'+bars(data.filter(e=>($('who').value==='Todos'||e.person===$('who').value)&&($('pay').value==='Todos'||e.type===$('pay').value)).map(e=>({...e,month:e.date.slice(0,7)})),'month')+'</article>'}if(view==='contas')html+='<article><h3>Por plataforma</h3>'+bars(a,'platform')+'</article><article><h3>Por pagamento</h3>'+bars(a,'type')+'</article>';html+='<article><h3>Lançamentos</h3>'+list(a)+'</article>';$('screen').innerHTML=html;bindDonut();document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(requireOnline()&&confirm("Excluir lançamento?")){b.disabled=true;writeRecord("/api/expenses/"+encodeURIComponent(b.dataset.delete),"DELETE").then(()=>{data=data.filter(e=>e.id!==b.dataset.delete);render();return refreshAfterWrite()}).catch(e=>{b.disabled=false;reportError(e)})}})}
function requireOnline(){if(online)return true;alert("Entre para salvar seus lançamentos no Supabase.");if(!$("loginModal").open)$("loginModal").showModal();return false}function openForm(id){if(!requireOnline())return;editing=id||null;expenseDraftId=editing||crypto.randomUUID();form.reset();form.elements.date.value=today();if(id){let e=data.find(x=>x.id===id);for(let k of ['person','date','description','category','type','platform'])form.elements[k].value=e[k];form.elements.value.value=e.cents/100}modal.showModal()}form.onsubmit=async e=>{e.preventDefault();if(!requireOnline()||expenseBusy)return;let f=Object.fromEntries(new FormData(form)),cents=Math.round(Number(f.value)*100);if(!Number.isSafeInteger(cents)||cents<=0||!f.description.trim()||!f.platform.trim())return;delete f.value;f.cents=cents;f.id=expenseDraftId;expenseBusy=true;const submit=form.querySelector("button.primary");submit.disabled=true;try{await writeRecord("/api/expenses","PUT",f);data=[...data.filter(x=>x.id!==f.id),f];selectMonth(f.date.slice(0,7));$("who").value=$("pay").value="Todos";modal.close();render();await refreshAfterWrite()}catch(e){reportError(e)}finally{expenseBusy=false;submit.disabled=false}};function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='nosso-backup.json';a.click();URL.revokeObjectURL(url)}$('restore').onchange=async e=>{try{if(!requireOnline())return;let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>typeof x.id==='string'&&Number.isSafeInteger(x.cents)&&x.cents>0&&people.includes(x.person)&&types.includes(x.type)&&cats.includes(x.category)&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.description==='string'&&typeof x.platform==='string'))throw Error();for(let x of a)await writeRecord("/api/expenses","PUT",x);await refreshAfterWrite()}catch(e){alert("Importação incompleta ou inválida. Atualize os dados para verificar o que foi salvo.")}e.target.value=''};render();
async function loadOnline(){const snapshot=await api("/api/snapshot");if(!Array.isArray(snapshot.expenses)||!Array.isArray(snapshot.incomes))throw Error("Dados inválidos do servidor");data=snapshot.expenses;incomes=snapshot.incomes;online=true;document.body.classList.add("authenticated");if($("loginModal").open)$("loginModal").close();syncLabel("Sincronizado com Supabase");$("syncLogin").textContent="Sair";render()}
$("refreshData").onclick=async()=>{if(!requireOnline())return;try{await loadOnline()}catch(e){reportError(e)}};
$("syncLogin").onclick=async()=>{try{if(online){await api("/api/logout","POST");location.reload();return}if(!$("loginModal").open)$("loginModal").showModal()}catch(e){reportError(e)}};
$("loginForm").onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector("button.primary");b.disabled=true;$("loginError").textContent="Entrando…";try{await api("/api/login","POST",Object.fromEntries(new FormData(e.target)));await loadOnline();e.target.reset();$("loginError").textContent=""}catch(e){$("loginError").textContent=e.message}finally{b.disabled=false}};

function renderIncome(){editingIncomeId=null;incomeDraftId=crypto.randomUUID();let m=$("month").value, p=$("who").value, match=e=>(!m||e.date.startsWith(m))&&(p==="Todos"||e.person===p), a=incomes.filter(match), total=sum(a), spent=sum(data.filter(match)), balance=total-spent;$("screen").innerHTML='<div class="grid"><article><small>Receitas previstas</small><div class="amount">'+money(total)+'</div></article><article><small>Despesas do mês</small><div class="amount">'+money(spent)+'</div></article><article><small>'+(balance<0?'Vai faltar':'Vai sobrar')+'</small><div class="amount" style="color:'+(balance<0?'#ff9999':'#bca0ff')+'">'+money(Math.abs(balance))+'</div></article></div><article><h3>Adicionar receita</h3><form id="incomeForm"><label>Quem?<select name="person">'+options(people)+'</select></label><label>Origem do dinheiro<input name="description" required placeholder="Salário, extra, etc."></label><div class="grid"><label>Valor (R$)<input name="value" type="text" inputmode="decimal" placeholder="0,00" required></label><label>Data prevista<input name="date" type="date" required value="'+esc(m?m+(today().startsWith(m)?today().slice(7):"-01"):today())+'"></label></div><label>Situação<select name="status"><option>Prevista</option><option>Recebida</option></select></label><button class="primary">Adicionar receita</button></form></article><article><h3>Receitas do período</h3><p>Já recebido: '+money(sum(a.filter(e=>e.status==="Recebida")))+'</p>'+[...a].sort((x,y)=>y.date.localeCompare(x.date)).map(e=>'<div class="item row"><div><b>'+esc(e.description)+'</b><br><small>'+esc(e.person)+' · '+esc(e.date)+' · '+esc(e.status)+'</small></div><b>'+money(e.cents)+'</b><button data-income-edit="'+esc(e.id)+'">Editar</button> <button data-income="'+esc(e.id)+'">Excluir</button>'+(e.status==="Prevista"?'<button data-received="'+esc(e.id)+'">Marcar recebida</button>':'')+'</div>').join('')+'</article>';$("incomeForm").onsubmit=async ev=>{ev.preventDefault();if(!requireOnline()| nt.querySelectorAll("[data-received]").forEach(b=>b.onclick=async()=>{if(!requireOnline())return;b.disabled=true;try{await saveIncome({...incomes.find(e=>e.id===b.dataset.received),status:"Recebida"});renderIncome();await refreshAfterWrite()}catch(e){b.disabled=false;reportError(e)}})}async function saveIncome(x){if(!requireOnline())throw Error("Login necessário");await writeRecord("/api/incomes","PUT",x);incomes=[...incomes.filter(e=>e.id!==x.id),x]}
