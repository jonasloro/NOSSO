<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOSSO | Finanças</title><style>
*{box-sizing:border-box}body{margin:0;background:#101512;color:#e8eee9;font:15px system-ui}header,main{max-width:1100px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:4px;margin:0;color:#c7f78c}small,label{color:#a0ada3}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #39463c;background:#202a23;color:white}button{cursor:pointer}button.primary{background:#c7f78c;color:#142016;font-weight:bold}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.panel,article{background:#19211b;border:1px solid #303d33;border-radius:15px;padding:20px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.amount{font-size:clamp(20px,4vw,34px);font-weight:700;color:#c7f78c;margin:10px 0}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}label{display:grid;gap:6px;margin-bottom:12px}input,select{width:100%;min-width:0}h2,h3{margin-top:0}progress{width:100%;accent-color:#a9dc7e;height:12px}dialog{background:#19211b;color:white;border:1px solid #39463c;border-radius:16px;width:min(94%,480px);max-height:90vh;overflow:auto}dialog::backdrop{background:#0009}.item{border-bottom:1px solid #303d33;padding:14px 0}.muted{color:#a0ada3}footer{padding:20px;text-align:center;color:#a0ada3}svg{max-width:100%}</style>
<header><div><h1>NOSSO</h1><small>Finanças da nossa casa</small></div><button class="primary" onclick="openForm()">+ Gasto</button></header><main><nav><button onclick="view='painel';render()">Visão geral</button><button onclick="view='lista';render()">Lançamentos</button><button onclick="view='contas';render()">Cartões e contas</button></nav><div class="panel grid"><label>Mês<input type="month" id="month"></label><label>Responsável<select id="who"><option>Todos</option><option>Jhonatan</option><option>Ari</option><option>Casa</option></select></label><label>Pagamento<select id="pay"><option>Todos</option></select></label></div><div id="screen"></div><div class="panel row"><button onclick="backup()">Exportar backup</button><label>Importar backup<input type="file" id="restore" accept=".json"></label></div></main><div class="panel" style="max-width:1060px;margin:12px auto"><button id="syncLogin">Entrar para sincronizar</button> <span id="syncStatus">Modo local</span></div><footer>Dados locais neste navegador · Não sincronizados entre aparelhos</footer>
<dialog id="modal"><form id="form"><h2>Novo lançamento</h2><label>Quem?<select name="person"><option>Jhonatan</option><option>Ari</option><option>Casa</option></select></label><div class="grid"><label>Valor (R$)<input name="value" type="number" min=".01" step=".01" required></label><label>Data<input name="date" type="date" required></label></div><label>Descrição<input name="description" required maxlength="200"></label><label>Categoria<select name="category"></select></label><label>Forma de pagamento<select name="type"></select></label><label>Banco, cartão ou plataforma<input name="platform" required maxlength="100"></label><div class="row"><button type="button" onclick="modal.close()">Cancelar</button><button class="primary">Salvar</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id),modal=$('modal'),form=$('form'),people=['Jhonatan','Ari','Casa'],types=['Cartão de crédito','Cartão de débito','Empréstimo','Financiamento','Pix','Dinheiro','Boleto','Outro'],cats=['Mercado','Alimentação','Moradia','Transporte','Lazer','Saúde','Compras','Assinaturas','Educação','Contas da casa','Dívidas','Outros'];let data=[],view='painel',editing=null;try{data=JSON.parse(localStorage.getItem('nosso')||'[]')}catch{}const today=()=>new Date().toLocaleDateString('sv-SE'),money=n=>(n/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),sum=a=>a.reduce((s,e)=>s+e.cents,0),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let online=false; async function api(path,method="GET",body){let r=await fetch(path,{method,headers:{"Content-Type":"application/json","X-Nosso":"1"},body:body===undefined?undefined:JSON.stringify(body)});if(!r.ok)throw Error("Falha na sincronização");return r.json()} function persist(){try{localStorage.setItem('nosso',JSON.stringify(data))}catch{alert('Não foi possível salvar no navegador. Exporte um backup.')}}function options(a){return a.map(x=>'<option>'+esc(x)+'</option>').join('')}form.elements.category.innerHTML=options(cats);form.elements.type.innerHTML=options(types);$('pay').innerHTML=options(['Todos',...types]);$('month').value=today().slice(0,7);['month','who','pay'].forEach(id=>$(id).onchange=render);
function groups(a,k){let m=new Map;for(let e of a)m.set(e[k],(m.get(e[k])||0)+e.cents);return [...m].sort((a,b)=>b[1]-a[1])}function bars(a,k){let t=sum(a);return groups(a,k).map(([n,v])=>'<div class="row"><span>'+esc(n)+'</span><b>'+money(v)+'</b></div><progress max="'+(t||1)+'" value="'+v+'"></progress>').join('')||'<p class="muted">Sem lançamentos</p>'}
function list(a){return [...a].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>'<div class="item"><div class="row"><div><b>'+esc(e.description)+'</b><br><small>'+esc(e.person)+' · '+esc(e.platform)+' · '+esc(e.type)+' · '+esc(e.date)+'</small></div><b>'+money(e.cents)+'</b></div><div class="row"><small>'+esc(e.category)+'</small><div><button data-edit="'+esc(e.id)+'">Editar</button> <button data-delete="'+esc(e.id)+'">Excluir</button></div></div></div>').join('')||'<p class="muted">Nenhum gasto registrado.</p>'}
function render(){let a=data.filter(e=>(!$('month').value||e.date.startsWith($('month').value))&&($('who').value==='Todos'||e.person===$('who').value)&&($('pay').value==='Todos'||e.type===$('pay').value)),t=sum(a);let html='<article><small>Total no período</small><div class="amount">'+money(t)+'</div>'+a.length+' lançamentos</article>';if(view==='painel'){html+='<div class="grid">'+people.map(p=>'<article><small>'+p+'</small><div class="amount">'+money(sum(a.filter(e=>e.person===p)))+'</div></article>').join('')+'</div><div class="grid"><article><h3>Por responsável</h3>'+bars(a,'person')+'</article><article><h3>Por categoria</h3>'+bars(a,'category')+'</article></div><article><h3>Evolução mensal</h3>'+bars(data.filter(e=>($('who').value==='Todos'||e.person===$('who').value)&&($('pay').value==='Todos'||e.type===$('pay').value)).map(e=>({...e,month:e.date.slice(0,7)})),'month')+'</article>'}if(view==='contas')html+='<article><h3>Por plataforma</h3>'+bars(a,'platform')+'</article><article><h3>Por pagamento</h3>'+bars(a,'type')+'</article>';html+='<article><h3>Lançamentos</h3>'+list(a)+'</article>';$('screen').innerHTML=html;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('Excluir lançamento?')){if(online){api("/api/expenses/"+encodeURIComponent(b.dataset.delete),"DELETE").then(loadOnline).catch(()=>alert("Não foi possível excluir"));return}data=data.filter(e=>e.id!==b.dataset.delete);persist();render()}})}
function openForm(id){editing=id||null;form.reset();form.elements.date.value=today();if(id){let e=data.find(x=>x.id===id);for(let k of ['person','date','description','category','type','platform'])form.elements[k].value=e[k];form.elements.value.value=e.cents/100}modal.showModal()}form.onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(form)),cents=Math.round(Number(f.value)*100);if(!Number.isSafeInteger(cents)||cents<=0||!f.description.trim()||!f.platform.trim())return;delete f.value;f.cents=cents;f.id=editing||crypto.randomUUID();if(online){try{await api("/api/expenses","PUT",f);await loadOnline()}catch{alert("Não foi possível salvar");return}}else{data=data.filter(x=>x.id!==f.id);data.push(f);persist()}$('month').value=f.date.slice(0,7);$('who').value=$('pay').value='Todos';modal.close();render()};function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='nosso-backup.json';a.click();URL.revokeObjectURL(url)}$('restore').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>typeof x.id==='string'&&Number.isSafeInteger(x.cents)&&x.cents>0&&people.includes(x.person)&&types.includes(x.type)&&cats.includes(x.category)&&typeof x.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&typeof x.description==='string'&&typeof x.platform==='string'))throw Error();if(online){for(let x of a)await api("/api/expenses","PUT",x);await loadOnline()}else{data=[...new Map([...data,...a].map(x=>[x.id,x])).values()];persist();render()}}catch{alert('Backup inválido')}e.target.value=''};render();
async function loadOnline(){data=await api("/api/expenses");online=true;$("syncStatus").textContent="Sincronizado";$("syncLogin").textContent="Sair";render()}$("syncLogin").onclick=async()=>{try{if(online){await api("/api/logout","POST");location.reload();return}let user=prompt("Usuário: Jhonatan ou Ari");if(!user)return;let password=prompt("Senha");if(!password)return;await api("/api/login","POST",{user,password});await loadOnline()}catch{alert("Login ou sincronização indisponível")}};loadOnline().catch(()=>{});</script></html>
